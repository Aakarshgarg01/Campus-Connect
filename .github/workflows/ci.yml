name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: student_predictor_test
          MYSQL_USER: sp_app
          MYSQL_PASSWORD: ci-app-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # CI-only throwaway credentials for the disposable service container above.
      DATABASE_URL: mysql+pymysql://sp_app:ci-app-password@127.0.0.1:3306/student_predictor_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://sp_app:ci-app-password@127.0.0.1:3306/student_predictor_test?charset=utf8mb4
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (incl. real-model prediction and SHAP additivity tests)
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build
